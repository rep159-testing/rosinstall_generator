---
name: Run tests

on:  # yamllint disable-line rule:truthy
  push:
    branches: ['master']
  pull_request:

jobs:
  pytest:
    uses: ros-infrastructure/ci/.github/workflows/pytest.yaml@main
    with:
      matrix-filter: del(.matrix.os[] | select(contains("windows")))
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: yamllint -f github .
  rep159:
    # The REP 159 tests skip with the rosdistro from PyPI; run them against
    # the REP 159 rosdistro, which reports the same version number.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: >-
          pip install --force-reinstall --no-deps
          'git+https://github.com/rep159-testing/rosdistro@rep159'
      - run: >-
          python -c "from rosdistro.distribution_file import DistributionFile;
          assert hasattr(DistributionFile, 'merge_extends')"
      - run: pytest -q -rs test/test_rep159.py
